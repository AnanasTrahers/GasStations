services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gasstations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5100:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gasstations-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
    ports:
      - "8000:8000"

  osrm-preprocessor:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm_preprocessor
    volumes:
      - ./data/osrm:/data
      - ./osrm/entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm_backend
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm ch /data/ukraine-latest.osrm
    depends_on:
      osrm-preprocessor:
        condition: service_completed_successfully

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-airflow-init
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "uv run python -c \"import psycopg2; conn = psycopg2.connect('postgresql://postgres:postgres@db:5432/gasstations'); conn.autocommit = True; conn.cursor().execute('CREATE SCHEMA IF NOT EXISTS airflow'); conn.close()\" && uv run airflow db migrate"
    volumes:
      - ./dags:/app/dags
      - ./airflow_home:/app/airflow_home
      - ./.env:/app/.env

  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-airflow-api-server
    env_file:
      - .env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: [ "uv", "run", "airflow", "api-server" ]
    volumes:
      - ./dags:/app/dags
      - ./airflow_home:/app/airflow_home
      - ./.env:/app/.env

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-airflow-scheduler
    env_file:
      - .env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: [ "uv", "run", "airflow", "scheduler" ]
    volumes:
      - ./dags:/app/dags
      - ./airflow_home:/app/airflow_home
      - ./.env:/app/.env

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-airflow-dag-processor
    env_file:
      - .env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["uv", "run", "airflow", "dag-processor"]
    volumes:
      - ./dags:/app/dags
      - ./airflow_home:/app/airflow_home
      - ./.env:/app/.env

  airflow-triggerer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-airflow-triggerer
    env_file:
      - .env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["uv", "run", "airflow", "triggerer"]
    volumes:
      - ./dags:/app/dags
      - ./airflow_home:/app/airflow_home
      - ./.env:/app/.env

volumes:
  postgres_data:
  redis_data:
