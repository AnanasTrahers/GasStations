services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gasstations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5100:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gasstations-redis
    restart: unless-stopped
    # Cron schedules are computed in-worker, but manually enqueued and deferred
    # jobs live only in Redis, so the queue needs to survive a restart.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
    ports:
      - "8000:8000"

  osrm-preprocessor:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm_preprocessor
    volumes:
      - ./data/osrm:/data
      - ./osrm/entrypoint.sh:/entrypoint.sh
    entrypoint: [ "/bin/bash", "/entrypoint.sh" ]

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    container_name: osrm_backend
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm ch /data/ukraine-latest.osrm
    depends_on:
      osrm-preprocessor:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gasstations-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "uv", "run", "arq", "src.worker.settings.WorkerSettings" ]
    volumes:
      - ./.env:/app/.env
    healthcheck:
      test: [ "CMD", "uv", "run", "arq", "--check", "src.worker.settings.WorkerSettings" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
