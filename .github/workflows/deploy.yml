name: Deploy to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ananases/gasstations-app
  WORKER_IMAGE_NAME: ananases/gasstations-worker

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push App image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    
    steps:
      - name: Execute SSH deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # TODO: Set your actual VPS project directory path below
            cd ~/GasStations
            
            # Pull the latest changes from git
            git checkout main
            git pull origin main
            
            # Login to GHCR to pull private images (if applicable)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest images
            docker compose -f docker-compose.prod.yml pull
            
            # Start the database and redis first (to ensure they are running for migrations)
            docker compose -f docker-compose.prod.yml up -d db redis
            
            # Run Alembic migrations against the production DB
            # We use a temporary container based on the new app image to run migrations
            docker compose -f docker-compose.prod.yml run --rm app uv run alembic upgrade head
            
            # Start/Update the rest of the stack
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Restart Nginx to ensure it resolves the new backend IP
            docker compose -f docker-compose.prod.yml restart nginx
