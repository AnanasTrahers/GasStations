[project]
name = "gasstations"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    # arq is maintenance-only upstream (see python-arq/arq#510). Newer releases
    # (0.26-0.28) cap redis at <6, which conflicts with the redis>=6.0.0 the app
    # itself uses, so stay on 0.25.x — it already has cron timezone support,
    # on_job_start and log_results.
    "arq>=0.25.0,<0.26",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.136.1",
    "geoalchemy2>=0.20.0",
    "graphviz>=0.21",
    "httpx>=0.28.1",
    "lxml>=5.0",
    "pydantic-settings>=2.14.1",
    "redis>=6.0.0",
    "shapely>=2.1.2",
    # [asyncio] pulls greenlet, which create_async_engine needs. It used to arrive
    # transitively via apache-airflow; without it every async DB call raises
    # "the greenlet library is required to use this function".
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.47.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
